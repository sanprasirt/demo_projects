global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
storage:
  tsdb:
    out_of_order_time_window: 10m
alerting:
  alertmanagers:
    - api_version: v2
      static_configs:
        - targets:
            - alertmanager:9093
rule_files:
  - /otel-lgtm/alerts.yml
scrape_configs:
  - job_name: shop
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - gateway:8000
          - catalog:8000
          - checkout:8000
  - job_name: postgres
    scrape_interval: 5s
    static_configs:
      - targets:
          - postgres-exporter:9187
