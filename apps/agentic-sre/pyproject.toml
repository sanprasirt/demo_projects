[project]
name = "agentic-sre"
version = "0.1.0"
description = "Agentic SRE demo for Day-2 operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pyyaml>=6",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-instrumentation-logging>=0.49b0",
  "openai>=1.55",
  "langgraph>=0.2.50",
  "nemoguardrails>=0.11",
]

[project.scripts]
agent = "agentic_sre.agent.server:main"
gateway = "agentic_sre.services.gateway:main"
catalog = "agentic_sre.services.catalog:main"
checkout = "agentic_sre.services.checkout:main"
loadgen = "agentic_sre.services.loadgen:main"
mock-llm = "agentic_sre.services.mock_llm:main"
mock-teams = "agentic_sre.services.mock_teams:main"
mock-gitlab = "agentic_sre.services.mock_gitlab:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_sre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
